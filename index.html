<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b3244f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>bibeO · Clic &amp; Accord</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Identité bibeO : en-tête blanc avec le logo et l'onde sonore, panneaux sombres (noir plume) pour la lisibilité,
   framboise en dégradé pour tout ce qui est actif. Police unique et lisible : Nunito Sans. */
:root{
  --bg:#fbf8f9;
  --fg:#1e191b;
  --muted:#7d6a71;
  --accent:#b3244f;
  --accent-deep:#861a3c;
  --accent-text:#e2567f;
  --accent-soft:#f6e3e9;
  --accent-ink:#ffffff;
  --good:#6fc45f;
  --bad:#ff7a6e;
  --grad:linear-gradient(180deg,#c42d5b 0%,#8a1a3d 100%);
  --font:"Nunito Sans","Nunito","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
  /* surfaces (valeurs de l'en-tête clair ; les panneaux les redéfinissent en sombre) */
  --surface:#ffffff;
  --surface-2:#f6eef1;
  --line:#e3d2d8;
  --line-strong:#d2b6c1;
  color-scheme:light;
}
section.panel{
  --surface:#2a2226;
  --surface-2:#352b30;
  --line:#473a40;
  --line-strong:#5a4a51;
  --fg:#f4eef0;
  --muted:#b7a6ad;
  --accent-soft:#4a2a36;
  --accent-text:#f07aa0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-block:0;padding-inline:16px;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:600;transition:background .12s,border-color .12s,transform .06s,box-shadow .12s}
button:hover{border-color:var(--accent-text)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
button.primary{background:var(--grad);color:var(--accent-ink);border-color:var(--accent-deep);font-weight:800;box-shadow:0 2px 10px rgba(179,36,79,.35)}
button.primary:hover{filter:brightness(1.08)}
button.on{background:var(--grad);color:var(--accent-ink);border-color:var(--accent-deep)}
select,input[type=number],input[type=text]{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums;width:6.5em;text-align:center;font-weight:700}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;max-width:1180px;margin-inline:auto}
.brand{display:flex;align-items:flex-end;gap:14px;min-width:0}
.brand img{height:54px;width:auto;display:block}
.brand .tagline{font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding-bottom:10px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:4px}
.tabs button{border:none;background:transparent;padding:8px 16px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.06em;border-radius:8px}
.tabs button:hover{background:var(--accent-soft)}
.tabs button.on{background:var(--grad);color:var(--accent-ink)}

.wave{display:block;width:100%;max-width:1180px;height:46px;margin:0 auto 4px;overflow:visible}
.wave rect{fill:var(--accent);transform-box:fill-box;transform-origin:center;transition:transform .07s ease-out}
.wave.pulse rect{transform:scaleY(1.55)}

main{display:grid;gap:16px;max-width:1180px;margin-inline:auto;padding-block:8px 28px}
section.panel{background:var(--surface);color:var(--fg);border:1px solid #1a1416;border-radius:16px;padding:18px;min-width:0;box-shadow:0 8px 28px rgba(30,25,27,.25)}
section.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent-text);margin:0 0 12px;font-weight:800;position:relative;padding-bottom:10px}
section.panel h2::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:linear-gradient(90deg,var(--accent-text) 0%,var(--line) 60%,transparent 100%)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stepper button{border:none;border-radius:0;background:transparent;padding:10px 14px;font-size:18px;line-height:1}
.stepper input{border:none;border-radius:0;background:transparent;border-inline:1px solid var(--line)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}

@media (max-width:959px){
  main>section.panel{display:none}
  main>section.panel.active{display:block}
}
@media (min-width:960px){
  main{grid-template-columns:1fr 1.2fr;align-items:start}
  .tabs{display:none}
}

/* ---------- Accordeur ---------- */
.note-display{display:flex;align-items:baseline;justify-content:center;gap:14px;min-height:96px;margin-top:4px}
.note-name{font-weight:800;font-size:84px;line-height:1;letter-spacing:-.02em;color:var(--fg);transition:color .15s}
.note-name.quiet{color:var(--line-strong)}
.note-sub{font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge{display:block;width:100%;max-width:440px;margin:0 auto;aspect-ratio:330/172}
.gauge .arc{fill:none;stroke:var(--surface-2);stroke-width:10;stroke-linecap:round}
.gauge .zone{fill:none;stroke:var(--good);stroke-width:10;stroke-linecap:butt;opacity:.75}
.gauge .tick{stroke:var(--line-strong);stroke-width:2}
.gauge .tick.major{stroke:var(--fg);stroke-width:2.5}
.gauge text{fill:var(--muted);font-family:var(--font);font-size:12px;text-anchor:middle;font-weight:700}
.gauge .needle{stroke:var(--accent-text);stroke-width:4;stroke-linecap:round;transform-box:view-box;transform-origin:165px 150px;transition:transform .09s linear,stroke .15s}
.gauge .hub{fill:var(--surface);stroke:var(--accent-text);stroke-width:4;transition:stroke .15s}
.gauge.in-tune .needle,.gauge.in-tune .hub{stroke:var(--good)}
.gauge.silent .needle{stroke:var(--line-strong)}
.cents{text-align:center;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:-6px;min-height:1.4em;font-weight:600}
.cents.good{color:var(--good)}
.cents.flat,.cents.sharp{color:var(--accent-text)}
.hint{color:var(--muted);text-align:center;font-size:15px;min-height:1.4em;font-weight:600}
.strings{display:flex;gap:6px;justify-content:center;margin-block:12px 10px;flex-wrap:wrap}
.strings button{font-size:19px;font-weight:800;width:52px;height:52px;padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px}
.strings button small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.strings button.on small{color:var(--accent-ink)}
.strings button.near{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.strings button.tuned{border-color:var(--good);box-shadow:0 0 0 3px rgba(111,196,95,.3)}
.tuner-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tuner-controls .field.wide{grid-column:1/-1}
.mic-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;min-height:1.3em}
.status.err{color:var(--bad)}
.level{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:10px}
.level i{display:block;height:100%;width:0;background:var(--accent-text);transition:width .08s}

/* ---------- Métronome ---------- */
.bpm-block{display:flex;flex-direction:column;align-items:center;gap:0}
.bpm-value{font-weight:800;font-size:112px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--fg);transition:color .05s}
.bpm-value.flash{color:var(--accent-text)}
.bpm-unit{font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tempo-name{color:var(--muted);font-size:14px;min-height:1.3em;font-style:italic}
.bpm-adjust{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.bpm-adjust button{flex:1 1 44px;max-width:72px;min-width:44px;font-size:17px;font-weight:800;padding:10px 4px;line-height:1;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent-text);margin:10px 0 2px}
.beats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-block:14px 4px;min-height:26px}
.beats i{display:block;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line-strong);transition:background .05s,transform .05s,border-color .05s}
.beats i.accent{border-color:var(--accent-text)}
.beats i.hit{background:var(--fg);border-color:var(--fg);transform:scale(1.2)}
.beats i.accent.hit{background:var(--accent-text);border-color:var(--accent-text);box-shadow:0 0 16px var(--accent-text)}
.transport{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.transport .play{min-width:200px;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:14px 22px;border-radius:14px}
.transport .tap{min-width:120px;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:14px 18px;border-radius:14px}
.metro-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px}
.metro-controls .field.wide{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:none;border-radius:0;background:transparent;padding:10px 10px;flex:1 1 auto;min-width:0;white-space:nowrap;font-size:15px;box-shadow:inset 1px 0 0 var(--line)}
.seg button.on{background:var(--grad);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:8px;padding:10px 0;font-weight:600}
.check input{accent-color:var(--accent);width:18px;height:18px}

/* ---------- Setlist ---------- */
.setlist{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.setlist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.setlist-head .label:first-child{color:var(--accent-text);font-size:14px;letter-spacing:.14em}
.setlist-add{display:flex;gap:8px;flex-wrap:wrap}
.setlist-add input[type=text]{flex:1;min-width:160px}
.songs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.songs li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px}
.songs li.current{border-color:var(--accent-text);background:var(--accent-soft)}
.songs li .song-main{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.songs li .song-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songs li .song-meta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.songs li.current .song-meta{color:var(--accent-text)}
.songs li button{padding:6px 10px;font-size:14px}
.songs li button.del{color:var(--muted)}
.songs li button.del:hover{color:var(--bad);border-color:var(--bad)}
.songs .empty{color:var(--muted);font-size:14px;padding:6px 0}
.setlist-nav{display:flex;gap:8px;justify-content:center;margin-top:10px}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.kbd kbd{border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;background:var(--surface-2)}
@media (max-width:959px){.kbd{display:none}}
@media (max-width:520px){header{flex-wrap:wrap}.tabs{width:100%}.tabs button{flex:1}.brand .tagline{display:none}}
@media (max-width:420px){.brand img{height:44px}.strings{gap:5px}.strings button{width:46px;height:46px;font-size:17px}.bpm-value{font-size:96px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main>
  <!-- ================= ACCORDEUR ================= -->
  <section class="panel active" id="panel-tuner" aria-labelledby="h-tuner">
    <h2 id="h-tuner">Accordeur</h2>

    <div class="note-display">
      <div class="note-name" id="note-name">—</div>
      <div class="note-sub" id="note-sub">en attente du micro</div>
    </div>

    <svg class="gauge silent" id="gauge" viewBox="0 0 330 172" aria-hidden="true">
      <path class="arc" id="gauge-arc"></path>
      <path class="zone" id="gauge-zone"></path>
      <g id="gauge-ticks"></g>
      <line class="needle" id="needle" x1="165" y1="150" x2="165" y2="40"></line>
      <circle class="hub" cx="165" cy="150" r="7"></circle>
    </svg>
    <div class="cents" id="cents"></div>
    <div class="hint" id="hint">Joue une corde à vide</div>

    <div class="strings" id="strings"></div>

    <div class="tuner-controls">
      <div class="field">
        <span class="label">Accordage</span>
        <select id="tuning"></select>
      </div>
      <div class="field">
        <span class="label">Référence La</span>
        <div class="stepper">
          <button type="button" id="a4-minus" aria-label="Baisser la référence">−</button>
          <input type="number" id="a4" min="415" max="466" step="1" value="440" aria-label="Fréquence du La de référence en hertz">
          <button type="button" id="a4-plus" aria-label="Monter la référence">+</button>
        </div>
      </div>
      <div class="field wide">
        <span class="label">Détection</span>
        <div class="seg" id="tuner-mode">
          <button type="button" data-mode="strings" class="on">Cordes de l’accordage</button>
          <button type="button" data-mode="chromatic">Chromatique</button>
        </div>
      </div>
    </div>

    <div class="mic-row">
      <button type="button" class="primary" id="mic-btn">Activer le micro</button>
    </div>
    <div class="level"><i id="level"></i></div>
    <div class="status" id="tuner-status"></div>
  </section>

  <!-- ================= MÉTRONOME ================= -->
  <section class="panel" id="panel-metro" aria-labelledby="h-metro">
    <h2 id="h-metro">Métronome</h2>

    <div class="bpm-block">
      <div class="bpm-value" id="bpm-value">120</div>
      <div class="bpm-unit">bpm</div>
      <div class="tempo-name" id="tempo-name">Allegro</div>
    </div>

    <input type="range" id="bpm-range" min="30" max="300" step="1" value="120" aria-label="Tempo">
    <div class="bpm-adjust">
      <button type="button" data-delta="-10">−10</button>
      <button type="button" data-delta="-5">−5</button>
      <button type="button" data-delta="-1">−1</button>
      <button type="button" data-delta="1">+1</button>
      <button type="button" data-delta="5">+5</button>
      <button type="button" data-delta="10">+10</button>
    </div>

    <div class="beats" id="beats" aria-hidden="true"></div>

    <div class="transport">
      <button type="button" class="primary play" id="play">Démarrer</button>
      <button type="button" class="tap" id="tap">Tap</button>
    </div>

    <div class="metro-controls">
      <div class="field">
        <span class="label">Temps par mesure</span>
        <div class="stepper">
          <button type="button" id="beats-minus" aria-label="Moins de temps">−</button>
          <input type="number" id="beats-n" min="1" max="12" step="1" value="4" aria-label="Nombre de temps par mesure">
          <button type="button" id="beats-plus" aria-label="Plus de temps">+</button>
        </div>
      </div>
      <div class="field wide">
        <span class="label">Subdivision</span>
        <div class="seg" id="subdiv">
          <button type="button" data-sub="1" class="on">Noires</button>
          <button type="button" data-sub="2">Croches</button>
          <button type="button" data-sub="3">Triolets</button>
          <button type="button" data-sub="4">Doubles</button>
        </div>
      </div>
      <div class="field">
        <span class="label">Son</span>
        <div class="seg" id="sound">
          <button type="button" data-sound="clic" class="on">Clic</button>
          <button type="button" data-sound="bois">Bois</button>
          <button type="button" data-sound="bip">Bip</button>
        </div>
      </div>
      <div class="field">
        <span class="label">Volume</span>

  </section>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fr = (n, d = 1) => n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });


/* ======================= Onde décorative ======================= */
(function buildWave() {
  const svg = $('wave'); const W = 1180, H = 46; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let seed = 20251122; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const N = 236, step = W / N;
  let html = '';
  for (let i = 0; i < N; i++) {
    const x = i / N;
    // bouffées d'énergie à gauche, au centre et à droite, comme sur l'affiche
    const env = 0.15 + 0.85 * Math.max(Math.exp(-Math.pow((x - 0.5) / 0.12, 2)), 0.7 * Math.exp(-Math.pow((x - 0.08) / 0.07, 2)), 0.7 * Math.exp(-Math.pow((x - 0.92) / 0.07, 2)));
    const h = Math.max(1.5, (rnd() * 0.7 + 0.3 * rnd()) * env * H);
    const op = 0.35 + 0.65 * env;
    html += `<rect x="${(i * step).toFixed(1)}" y="${((H - h) / 2).toFixed(1)}" width="${(step * 0.55).toFixed(2)}" height="${h.toFixed(1)}" rx="1" opacity="${op.toFixed(2)}"/>`;
  }
  svg.innerHTML = html;
})();

/* ======================= Onglets ======================= */
function showTab(which) {
  $('panel-tuner').classList.toggle('active', which === 'tuner');
  $('panel-metro').classList.toggle('active', which === 'metro');
  $('tab-tuner').classList.toggle('on', which === 'tuner');
  $('tab-metro').classList.toggle('on', which === 'metro');
  try { localStorage.setItem('ca-tab', which); } catch (e) {}
}
$('tab-tuner').addEventListener('click', () => showTab('tuner'));
$('tab-metro').addEventListener('click', () => showTab('metro'));
try { showTab(localStorage.getItem('ca-tab') === 'metro' ? 'metro' : 'tuner'); } catch (e) {}

/* ======================= Accordeur ======================= */

(function buildGauge() {
  const cx = 165, cy = 150, r = 120;
  const pt = (deg, rr) => { const a = deg * Math.PI / 180; return [cx + rr * Math.sin(a), cy - rr * Math.cos(a)]; };
  const arc = (d1, d2, rr) => { const [x1, y1] = pt(d1, rr), [x2, y2] = pt(d2, rr); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${rr} ${rr} 0 ${d2 - d1 > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  $('gauge-arc').setAttribute('d', arc(-90, 90, r));
  $('gauge-zone').setAttribute('d', arc(-9, 9, r)); // ±5 cents = ±9°
  const g = $('gauge-ticks');
  for (let c = -50; c <= 50; c += 5) {
    const deg = c * 1.8, major = c % 25 === 0;
    const [x1, y1] = pt(deg, r - 9), [x2, y2] = pt(deg, major ? r + 14 : r + 10);
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', x1.toFixed(1)); l.setAttribute('y1', y1.toFixed(1)); l.setAttribute('x2', x2.toFixed(1)); l.setAttribute('y2', y2.toFixed(1));
    l.setAttribute('class', 'tick' + (major ? ' major' : '')); g.appendChild(l);
    if (major) {
      const [tx, ty] = pt(deg, r + 26);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', tx.toFixed(1)); t.setAttribute('y', (ty + 4).toFixed(1));
      t.textContent = c === 0 ? '0' : (c > 0 ? '+' + c : String(c)); g.appendChild(t);
    }
  }
})();

// Détection de hauteur par autocorrélation (avec interpolation parabolique)
function autoCorrelate(buf, sampleRate, minHz = 35, maxHz = 1200) {
  const n = buf.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / n);
  if (rms < 0.008) return { freq: -1, rms };
  const maxLag = Math.min(n - 1, Math.floor(sampleRate / minHz));
  const minLag = Math.max(2, Math.floor(sampleRate / maxHz));
  const c = new Float32Array(maxLag + 1);
  for (let lag = 0; lag <= maxLag; lag++) {
    let s = 0;
    for (let j = 0; j < n - lag; j++) s += buf[j] * buf[j + lag];
    c[lag] = s / (n - lag);
  }
  // Première descente sous zéro, puis premier pic significatif
  let d = minLag;
  while (d < maxLag && c[d] > 0) d++;
  if (d >= maxLag) return { freq: -1, rms };
  let best = -1, bestPos = -1;
  for (let i = d; i <= maxLag; i++) if (c[i] > best) { best = c[i]; bestPos = i; }
  if (bestPos < 1 || best < 0.3 * c[0]) return { freq: -1, rms };
  // Préférer un pic plus précoce quasi aussi haut (évite les erreurs d'octave vers le bas)
  for (let i = d; i < bestPos; i++) {
    if (c[i] > 0.9 * best && c[i] > c[i - 1] && c[i] >= c[i + 1]) { bestPos = i; best = c[i]; break; }
  }
  const interp = (p) => {
    const x1 = c[p - 1], x2 = c[p], x3 = c[p + 1] ?? x2;
    const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
    return a ? p - b / (2 * a) : p;
  };
  let T = interp(bestPos);
  // Affinage : mesurer la période sur k cycles (pic vers k·T) divise l'erreur par k
  const k = Math.floor(Math.min(maxLag - 2, n * 0.6) / T);
  if (k >= 2) {
    const center = Math.round(k * T);
    let p = center;
    for (let i = center - 3; i <= center + 3; i++) if (i > 0 && i < maxLag && c[i] > c[p]) p = i;
    if (c[p] > 0.5 * best) T = interp(p) / k;
  }
  return { freq: sampleRate / T, rms };
}
window.autoCorrelate = autoCorrelate;

function setTunerStatus(msg, err) { const s = $('tuner-status'); s.textContent = msg; s.classList.toggle('err', !!err); }

async function startMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

  }

    tuner.ctx = tuner.ctx || new (window.AudioContext || window.webkitAudioContext)();

function showSilence(sub) {
  $('note-name').textContent = '–'; $('note-name').classList.add('quiet'); $('note-sub').textContent = sub || '';
  $('cents').textContent = ''; $('cents').className = 'cents';

function tick() {
  if (!tuner.running) return;
  tuner.raf = requestAnimationFrame(tick);
  const isBass = tuner.tuningKey.startsWith('bass');
  const wantSize = isBass ? 8192 : 4096;
  if (tuner.analyser.fftSize !== wantSize) { tuner.analyser.fftSize = wantSize; tuner.buf = new Float32Array(wantSize); }
  tuner.analyser.getFloatTimeDomainData(tuner.buf);
  const sr = tuner.ctx.sampleRate;
  const { freq, rms } = autoCorrelate(tuner.buf, sr, isBass ? 28 : 60, 1300);
  $('level').style.width = clamp(rms * 400, 0, 100) + '%';
  const now = performance.now();
  if (freq > 0 && isFinite(freq)) {
    tuner.history.push(freq); if (tuner.history.length > 6) tuner.history.shift();
    tuner.lastSignal = now;
  } else if (now - tuner.lastSignal > 600) {
    tuner.history = [];
    showSilence('');
    return;
  } else return;
  if (tuner.history.length < 3) return;
  const sorted = [...tuner.history].sort((a, b) => a - b);
  const f = sorted[Math.floor(sorted.length / 2)];
  renderPitch(f);
}

function renderPitch(f) {
  const midiF = freqToMidi(f);
  let targetMidi, nearIdx = -1;
  if (tuner.mode === 'strings') {
    const strs = TUNINGS[tuner.tuningKey].midi;
    if (tuner.pinned !== null) nearIdx = tuner.pinned;
    else {
      let bestD = Infinity;
      strs.forEach((m, i) => { const d = Math.abs(m - midiF); if (d < bestD) { bestD = d; nearIdx = i; } });
    }
    targetMidi = strs[nearIdx];
  } else {
    targetMidi = Math.round(midiF);
  }
  const cents = (midiF - targetMidi) * 100;
  const l = noteLabel(targetMidi);
  $('note-name').textContent = l.fr; $('note-name').classList.remove('quiet');
  $('note-sub').textContent = `${l.en} · ${fr(f)} Hz`;
  const shown = clamp(cents, -50, 50);
  $('needle').style.transform = `rotate(${(shown * 1.8).toFixed(1)}deg)`;
  const inTune = Math.abs(cents) <= 5;
  const g = $('gauge'); g.classList.remove('silent'); g.classList.toggle('in-tune', inTune);
  const c = $('cents');
  c.textContent = (cents > 0 ? '+' : cents < 0 ? '−' : '') + fr(Math.abs(cents), 0) + ' ¢';
  c.className = 'cents ' + (inTune ? 'good' : cents < 0 ? 'flat' : 'sharp');
  let hint;
  if (Math.abs(cents) > 60) hint = cents < 0 ? 'Très bas · remonte franchement' : 'Très haut · redescends franchement';
  else if (inTune) hint = 'Juste ✓';
  else hint = cents < 0 ? 'Trop bas · tends la corde' : 'Trop haut · détends la corde';
  $('hint').textContent = hint;
  for (const b of $('strings').children) {
    const i = +b.dataset.i;
    b.classList.toggle('near', i === nearIdx);
    b.classList.toggle('tuned', i === nearIdx && inTune);
  }
}

function ensureAudio() {

// kind : 'accent' | 'beat' | 'sub'
function scheduleClick(time, kind) {
  const ctx = metro.ctx;
  const gainLevel = kind === 'accent' ? 1 : kind === 'beat' ? 0.75 : 0.35;
  const env = ctx.createGain(); env.connect(metro.master);
  if (metro.sound === 'bip') {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = kind === 'accent' ? 1320 : kind === 'beat' ? 880 : 660;
    env.gain.setValueAtTime(0, time); env.gain.linearRampToValueAtTime(gainLevel, time + 0.002);
    env.gain.exponentialRampToValueAtTime(0.001, time + 0.07);
    o.connect(env); o.start(time); o.stop(time + 0.08);
  } else if (metro.sound === 'bois') {
    const src = ctx.createBufferSource(); src.buffer = metro.noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
    bp.frequency.value = kind === 'accent' ? 2200 : kind === 'beat' ? 1500 : 1100;
    env.gain.setValueAtTime(0, time); env.gain.linearRampToValueAtTime(gainLevel * 1.6, time + 0.001);
    env.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
    src.connect(bp); bp.connect(env); src.start(time); src.stop(time + 0.06);
  } else {
    const o = ctx.createOscillator(); o.type = 'triangle';
    const f0 = kind === 'accent' ? 2600 : kind === 'beat' ? 1900 : 1400;
    o.frequency.setValueAtTime(f0, time); o.frequency.exponentialRampToValueAtTime(f0 * 0.6, time + 0.02);
    env.gain.setValueAtTime(0, time); env.gain.linearRampToValueAtTime(gainLevel, time + 0.001);
    env.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
    o.connect(env); o.start(time); o.stop(time + 0.04);
  }
}

const LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.12;
function scheduler() {

    const isDown = metro.subIdx === 0;
    const kind = isDown ? (metro.beat === 0 && metro.accent ? 'accent' : 'beat') : 'sub';
    scheduleClick(metro.nextTime, metro.countingIn && !isDown ? 'sub' : kind);
    metro.queue.push({ time: metro.nextTime, beat: metro.beat, isDown, countIn: metro.countingIn });
    metro.nextTime += (60 / metro.bpm) / metro.sub;
    metro.subIdx++;
    if (metro.subIdx >= metro.sub) {
      metro.subIdx = 0; metro.beat++;
      if (metro.beat >= metro.beats) { metro.beat = 0; metro.countingIn = false; }
    }

  let ev = null;
  while (metro.queue.length && metro.queue[0].time <= now) ev = metro.queue.shift();
  if (!ev) return;
  const dots = $('beats').children;
  for (let i = 0; i < dots.length; i++) dots[i].classList.toggle('hit', i === ev.beat);
  if (ev.isDown) { $('wave').classList.add('pulse'); setTimeout(() => $('wave').classList.remove('pulse'), 80); }
  if (ev.isDown && ev.beat === 0) { $('bpm-value').classList.add('flash'); setTimeout(() => $('bpm-value').classList.remove('flash'), 90); }
  if (ev.countIn) $('play').textContent = `Décompte ${ev.beat + 1}`;

}

// Tap tempo
function tapTempo() {
  const now = performance.now();
  if (metro.taps.length && now - metro.taps[metro.taps.length - 1] > 2000) metro.taps = [];
  metro.taps.push(now); if (metro.taps.length > 8) metro.taps.shift();
  if (metro.taps.length >= 2) {
    const intervals = []; for (let i = 1; i < metro.taps.length; i++) intervals.push(metro.taps[i] - metro.taps[i - 1]);
    const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;
    setBpm(60000 / avg);
  }
  $('tap').textContent = metro.taps.length < 2 ? 'Tap…' : 'Tap';
  clearTimeout(tapTempo._t); tapTempo._t = setTimeout(() => { $('tap').textContent = 'Tap'; metro.taps = []; }, 2000);
  ensureAudio(); if (!metro.playing) { metro.ctx.resume(); scheduleClick(metro.ctx.currentTime + 0.005, 'beat'); }
}
$('tap').addEventListener('click', tapTempo);

// Écran allumé pendant la lecture
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) metro.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWakeLock() { try { metro.wakeLock && metro.wakeLock.release(); } catch (e) {} metro.wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && metro.playing) requestWakeLock(); });

// Clavier
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.code === 'Space') { e.preventDefault(); toggleMetro(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setBpm(metro.bpm + 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setBpm(metro.bpm - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setBpm(metro.bpm + 5); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setBpm(metro.bpm - 5); }
  else if (e.key === 't' || e.key === 'T') tapTempo();
  else if (e.key === 'n' || e.key === 'N') stepSong(1);
  else if (e.key === 'p' || e.key === 'P') stepSong(-1);
});

/* ======================= Setlist ======================= */
let songs = [], currentSong = null;
try { songs = JSON.parse(localStorage.getItem('ca-setlist') || '[]'); if (!Array.isArray(songs)) songs = []; } catch (e) { songs = []; }
function saveSongs() { try { localStorage.setItem('ca-setlist', JSON.stringify(songs)); } catch (e) {} }
function renderSongs() {
  const ul = $('songs'); ul.innerHTML = '';
  $('setlist-count').textContent = songs.length ? `${songs.length} morceau${songs.length > 1 ? 'x' : ''}` : '';
  $('setlist-nav').hidden = songs.length < 2;
  if (!songs.length) { const li = document.createElement('li'); li.className = 'empty'; li.style.cssText = 'background:none;border:none;padding:4px 0'; li.textContent = 'Aucun morceau. Règle le tempo, donne un nom et ajoute-le : pendant la répète, un appui charge le bon clic.'; ul.appendChild(li); return; }
  const SUBS = { 1: 'noires', 2: 'croches', 3: 'triolets', 4: 'doubles' };
  songs.forEach((s, i) => {
    const li = document.createElement('li'); li.classList.toggle('current', i === currentSong);
    const main = document.createElement('div'); main.className = 'song-main'; main.title = 'Charger ce tempo';
    main.innerHTML = `<span class="song-name"></span><span class="song-meta">${s.bpm} bpm · ${s.beats}/4${s.sub > 1 ? ' · ' + SUBS[s.sub] : ''}</span>`;
    main.querySelector('.song-name').textContent = s.name;
    main.addEventListener('click', () => loadSong(i));
    const up = document.createElement('button'); up.type = 'button'; up.textContent = '↑'; up.title = 'Monter'; up.disabled = i === 0;
    up.addEventListener('click', () => { [songs[i - 1], songs[i]] = [songs[i], songs[i - 1]]; if (currentSong === i) currentSong = i - 1; else if (currentSong === i - 1) currentSong = i; saveSongs(); renderSongs(); });
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '✕'; del.title = 'Retirer';
    del.addEventListener('click', () => { songs.splice(i, 1); if (currentSong === i) currentSong = null; else if (currentSong > i) currentSong--; saveSongs(); renderSongs(); });
    li.append(main, up, del); ul.appendChild(li);
  });
}
function loadSong(i) {
  const s = songs[i]; if (!s) return;
  currentSong = i;
  setBeats(s.beats); setSub(s.sub); setBpm(s.bpm);
  metro.beat = 0; metro.subIdx = 0;
  renderSongs();
}
function stepSong(dir) {
  if (!songs.length) return;
  const next = currentSong === null ? (dir > 0 ? 0 : songs.length - 1) : (currentSong + dir + songs.length) % songs.length;
  loadSong(next);
}
function markCurrentSong() {
  if (currentSong === null) return;
  const s = songs[currentSong];
  if (!s || s.bpm !== metro.bpm || s.beats !== metro.beats || s.sub !== metro.sub) { currentSong = null; renderSongs(); }
}
$('setlist-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('song-name').value.trim() || `Morceau ${songs.length + 1}`;
  songs.push({ name, bpm: metro.bpm, beats: metro.beats, sub: metro.sub });
  currentSong = songs.length - 1; $('song-name').value = '';
  saveSongs(); renderSongs();
});
$('prev-song').addEventListener('click', () => stepSong(-1));
$('next-song').addEventListener('click', () => stepSong(1));

/* ======================= Init ======================= */
setBpm(metro.bpm); setBeats(metro.beats); setSub(metro.sub); setSound(metro.sound);
renderSongs();
</script>
</body>
</html>
